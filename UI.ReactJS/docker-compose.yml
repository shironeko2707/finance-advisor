version: '3.8'

services:
  lengkeng-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lengkeng-ui
    ports:
      - "8800:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8800 || exit 1'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lengkeng-network

networks:
  lengkeng-network:
    driver: bridge
