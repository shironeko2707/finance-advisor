# Cấu hình nginx cho host machine
# File: /etc/nginx/sites-available/lengkeng-doc.hocai.fun

upstream mkdocs_backend {
    server 127.0.0.1:8000;
    # Thêm health check nếu cần
    # health_check;
}

server {
    listen 80;
    server_name lengkeng-doc.hocai.fun;
    
    # Redirect HTTP to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lengkeng-doc.hocai.fun;

    # SSL Configuration - Let's Encrypt certificates
    ssl_certificate /etc/letsencrypt/live/lengkeng-doc.hocai.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lengkeng-doc.hocai.fun/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Basic Authentication
    auth_basic "Lengkeng Documentation - Restricted Access";
    auth_basic_user_file /etc/nginx/htpasswd/lengkeng-doc.htpasswd;

    # Rate Limiting (optional)
    # limit_req_zone $binary_remote_addr zone=lengkeng_login:10m rate=10r/m;
    # limit_req zone=lengkeng_login burst=5 nodelay;

    # Logging
    access_log /var/log/nginx/lengkeng-doc.access.log;
    error_log /var/log/nginx/lengkeng-doc.error.log;

    location / {
        proxy_pass http://mkdocs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Proxy timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Handle WebSocket upgrades if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static files optimization
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://mkdocs_backend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status "STATIC";
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        proxy_pass http://mkdocs_backend;
        proxy_set_header Host $host;
    }
}
