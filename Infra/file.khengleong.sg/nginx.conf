events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8088;
        server_name localhost;

        # Serve files from storage directory
        location /storage {
            alias /mnt/data/hoangpt/report-automation-project/API.FastPy/storage;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            
            # Allow all file types
            location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|doc|docx|xls|xlsx|zip|rar|mp4|avi|mov|wmv|flv|webm|mp3|wav|ogg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Default location
        location / {
            return 200 "Nginx Storage Server is running on port 8088\n";
            add_header Content-Type text/plain;
        }
    }
}
