version: '3.8'

services:
  nginx-storage:
    build: .
    container_name: nginx-storage-server
    ports:
      - "8088:8088"
    volumes:
      - /mnt/data/hoangpt/report-automation-project/API.FastPy/storage:/mnt/data/hoangpt/report-automation-project/API.FastPy/storage:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
